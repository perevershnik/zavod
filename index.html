<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Сільпо: Darkstore Simulator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-dot"></div>
        <div>
          <h1>Сільпо: Darkstore Simulator</h1>
          <p>Онлайн-смена в реальном времени</p>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><span>Заказы</span><b id="ordersStat">0</b></div>
        <div class="stat"><span>Товары</span><b id="itemsStat">0</b></div>
        <div class="stat"><span>Упаковано</span><b id="packedStat">0</b></div>
        <div class="stat"><span>Смена</span><b id="timeStat">00:00</b></div>
      </div>
    </header>

    <main>
      <section class="game-wrap">
        <canvas id="game"></canvas>

        <div class="floating-panel">
          <button id="pauseBtn">Пауза</button>
          <button id="speedBtn">x1</button>
          <button id="newOrderBtn">+ Заказ</button>
        </div>

        <div class="legend">
          <span><i class="dot waiting"></i>Свободен</span>
          <span><i class="dot picking"></i>Собирает</span>
          <span><i class="dot packing"></i>Пакует</span>
        </div>
      </section>

      <aside class="sidebar">
        <div class="panel">
          <div class="panel-title">
            <h2>Команда смены</h2>
            <span id="workersCount"></span>
          </div>
          <div id="workersList" class="workers-list"></div>
        </div>

        <div class="panel orders-panel">
          <div class="panel-title">
            <h2>Активные заказы</h2>
            <span id="activeOrdersCount">0</span>
          </div>
          <div id="ordersList" class="orders-list"></div>
        </div>
      </aside>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>
